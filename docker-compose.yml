services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  jyotish-app:
    build: .
    ports:
      - "80:80"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  celery-beat:
    build: .
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always
